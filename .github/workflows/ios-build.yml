name: iOS-App bauen

# Unsigniert: SideStore signiert beim Installieren mit der kostenlosen Apple-ID.
# macOS-Minuten zählen zehnfach, deshalb nur auf Knopfdruck oder nach einem Push, der
# die App berührt.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS-Rechner (macos-26 hing oft in der Warteschlange, daher macos-15)"
        default: macos-15
  push:
    # Auf Arbeits-Branches nur auf Knopfdruck – jeder Push dort würde Mac-Minuten kosten.
    branches: [main]
    paths: [ios/**, rechtliches/**, .github/workflows/ios-build.yml]

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25
    permissions:
      contents: write  # Release für das Update per Fingertipp anlegen
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 wählen
        run: |
          neuestes=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$neuestes" ]; then sudo xcode-select -s "$neuestes"; fi
          xcodebuild -version

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      # Im Repo stehen nur Platzhalter (es ist öffentlich); die echten Impressum-Angaben kommen
      # aus dem Secret. Bleibt ein Platzhalter offen, bricht der Build ab.
      - name: Impressum eintragen
        env:
          IMPRESSUM_JSON: ${{ secrets.IMPRESSUM_JSON }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          pfad = "../rechtliches/rechtliches.json"
          texte = json.load(open(pfad, encoding="utf-8"))
          echte = json.loads(os.environ.get("IMPRESSUM_JSON") or "{}")
          texte["angaben"].update({k: v for k, v in echte.items() if k in texte["angaben"]})
          offen = [k for k, v in texte["angaben"].items() if v.startswith("[") and v.endswith("]")]
          if offen:
              sys.exit(f"Impressum unvollständig, Secret IMPRESSUM_JSON prüfen: {offen}")
          json.dump(texte, open(pfad, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF

      - name: Bauen
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          xcodebuild -project Geschenke.xcodeproj -scheme Geschenke \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            APP_TOKEN="$APP_TOKEN" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | grep -E "error:|warning: .*Geschenke|BUILD" || true
          # Der .app-Ordner entsteht auch bei Compile-Fehlern, erst die Programmdatei zeigt Erfolg
          test -f build/Build/Products/Release-iphoneos/Geschenke.app/Geschenke
          # Für den App Store Pflicht: Privacy Manifest und die Rechtstexte für Impressum & Co.
          test -f build/Build/Products/Release-iphoneos/Geschenke.app/PrivacyInfo.xcprivacy
          test -f build/Build/Products/Release-iphoneos/Geschenke.app/rechtliches.json
          plutil -lint build/Build/Products/Release-iphoneos/Geschenke.app/PrivacyInfo.xcprivacy
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' build/Build/Products/Release-iphoneos/Geschenke.app/Info.plist)" = "false"

      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Geschenke.app Payload/
          zip -qr Geschenke.ipa Payload

      # Kein Artifact-Upload: Bei einem öffentlichen Repo könnte jeder die .ipa laden – und darin
      # steht der App-Token. Deshalb landet sie nur im privaten Repo geschenke-releases.
      # SideStore-Quelle (Server: /dl/<geheimnis>/source.json) liest immer das neueste Release dort.
      # Nur von main – Arbeits-Branches landen nie auf dem Handy.
      - name: Release für Update per Fingertipp
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTIZ: ${{ github.event.head_commit.message || 'manuell gebaut' }}
        run: |
          gh release create "app-${{ github.run_number }}" Geschenke.ipa \
            --repo lukaclaude2-star/geschenke-releases \
            --title "App 1.0.${{ github.run_number }}" --notes "$NOTIZ"
