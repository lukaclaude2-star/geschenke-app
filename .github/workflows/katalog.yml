name: Katalog bauen

# Einmal am Tag: neue/geänderte Produkte durch den Ramsch-Filter schicken und von der KI
# verschlagworten lassen. Unveränderte Produkte werden wiederverwendet (kostet nichts).
# Ändert sich katalog.json, wird committet – Render baut daraufhin neu.
#
# Das Repo ist seit 10.11.2026 öffentlich, Läufe auf ubuntu-latest kosten also keine Minuten mehr.
# Ein Lauf schöpft aber das KI-Kontingent (Groq/NVIDIA) aus, darum nicht unnötig von Hand starten.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    # Katalog bis ~50 min, danach Bilder prüfen bis 10 min.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Awin-Feeds laden
        # Bis zur Annahme bei Awin ist das Secret leer, dann wird der Schritt übersprungen.
        # Die awin-*.json werden nicht committet, sie kommen jede Nacht frisch.
        env:
          AWIN_FEEDS: ${{ secrets.AWIN_FEEDS }}
        run: |
          if [ -n "$AWIN_FEEDS" ]; then python scripts/lade_awin_feeds.py; else echo "AWIN_FEEDS leer, übersprungen"; fi
      - name: Katalog bauen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KATALOG_MAX_STAPEL: "3000"
          # Job-Grenze 60 min; nach 45 min keine neuen Stapel, ein laufender braucht höchstens 4 min.
          # Was offen bleibt, kommt beim nächsten Nachtlauf dran.
          KATALOG_MAX_MINUTEN: "45"
        run: python scripts/build_katalog.py
      - name: Bilder prüfen
        # Produkte, deren Foto nicht lädt, zeigt der Server nicht (app/katalog/bildpruefung.py).
        env:
          BILDER_MAX_MINUTEN: "10"
        run: python scripts/pruefe_bilder.py
      - name: Committen, falls geändert
        run: |
          git config user.name katalog-bot
          git config user.email katalog-bot@users.noreply.github.com
          git add katalog/katalog.json katalog/bilder.json
          git diff --cached --quiet || git commit -m "Katalog aktualisieren"
          git push
