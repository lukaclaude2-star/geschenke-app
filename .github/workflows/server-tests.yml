name: Server testen

on:
  push:
    paths: [app/**, tests/**, scripts/**, katalog/**, requirements*.txt, pytest.ini, .github/workflows/server-tests.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
