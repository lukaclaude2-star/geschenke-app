name: Geschenke
options:
  bundleIdPrefix: de.luka
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
packages:
  GeschenkeCore:
    path: GeschenkeCore
targets:
  Geschenke:
    type: application
    platform: iOS
    sources:
      - Geschenke
      # Rechtstexte: dieselbe Datei zeigt der Server als Webseiten (app/rechtliches.py).
      - path: ../rechtliches/rechtliches.json
        buildPhase: resources
    scheme: {}
    dependencies:
      - package: GeschenkeCore
    info:
      path: Geschenke/Info.plist
      properties:
        CFBundleDisplayName: Geschenke
        CFBundleDevelopmentRegion: de
        # Versionsnummer kommt vom CI-Build (1.0.<Lauf>) – SideStore vergleicht sie mit der Quelle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Schrift (SIL Open Font License, siehe Schriften/*-OFL.txt): Fraunces für Überschriften,
        # Nunito Sans für Text. Feste Schnitte aus ios/werkzeuge/schriften/instanzen.py.
        UIAppFonts: [FrauncesSoft-Bold.ttf, NunitoSans-Regular.ttf, NunitoSans-SemiBold.ttf,
                     NunitoSans-Bold.ttf, NunitoSans-ExtraBold.ttf]
        # Kommt beim CI-Build aus dem GitHub-Secret APP_TOKEN, steht nie im Repo.
        AppToken: $(APP_TOKEN)
        # Nur HTTPS über URLSession, keine eigene Verschlüsselung: von der Exportdokumentation
        # befreit. Spart die Frage bei jedem Upload in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.luka.geschenke
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APP_TOKEN: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
