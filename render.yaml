services:
  - type: web
    name: geschenke
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # sync: false bedeutet: Wert im Render-Dashboard eintragen, nie im Repo.
      - key: APP_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DOWNLOAD_GEHEIMNIS
        sync: false
